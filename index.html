<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Snake</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #163d4d 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #35164d 0%,
                    transparent 35%
                ),
                #050812;
        }

        .game-container {
            width: min(95vw, 620px);

            padding: 25px;

            border-radius: 30px;

            background: rgba(10, 18, 35, 0.82);

            border: 1px solid rgba(0, 255, 255, 0.2);

            box-shadow:
                0 0 40px rgba(0, 255, 255, 0.12),
                0 0 100px rgba(130, 0, 255, 0.08);

            backdrop-filter: blur(15px);
        }


        /* =========================
           TITLE
        ========================= */

        .title {
            text-align: center;
            margin-bottom: 20px;
        }

        .title h1 {
            font-size: 38px;

            letter-spacing: 4px;

            background: linear-gradient(
                90deg,
                #00ffff,
                #00ff88,
                #9d5cff
            );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .title p {
            color: #8290a8;

            margin-top: 5px;

            font-size: 13px;
        }


        /* =========================
           SCORE
        ========================= */

        .top-bar {
            display: flex;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 15px;
        }

        .score-box {
            flex: 1;

            padding: 12px;

            text-align: center;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .score-box span {
            display: block;

            font-size: 12px;

            color: #7f8ca5;

            margin-bottom: 4px;
        }

        .score-box strong {
            font-size: 22px;

            color: #00ffff;
        }


        /* =========================
           GAME CANVAS
        ========================= */

        #gameCanvas {
            width: 100%;

            aspect-ratio: 1 / 1;

            display: block;

            border-radius: 22px;

            background: #07101c;

            border: 1px solid rgba(0, 255, 255, 0.18);

            box-shadow:
                inset 0 0 35px rgba(0, 255, 255, 0.05),
                0 0 25px rgba(0, 255, 255, 0.08);

            touch-action: none;
        }


        /* =========================
           MAIN BUTTONS
        ========================= */

        .buttons {
            display: flex;

            gap: 10px;

            margin-top: 15px;
        }

        button {
            flex: 1;

            border: none;

            padding: 13px;

            border-radius: 14px;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.08);

            transition:
                transform 0.15s,
                background 0.15s,
                box-shadow 0.15s;

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;
        }

        button:hover {
            transform: translateY(-2px);

            background: rgba(0, 255, 255, 0.12);

            box-shadow:
                0 0 18px rgba(0, 255, 255, 0.12);
        }

        button:active {
            transform: scale(0.96);
        }

        .restart {
            background: linear-gradient(
                135deg,
                #00a8ff,
                #7c3cff
            );
        }

        .restart:hover {
            background: linear-gradient(
                135deg,
                #00d9ff,
                #9d5cff
            );
        }


        /* =========================
           MOBILE GAME CONTROLS
        ========================= */

        .controls {
            width: 220px;

            margin: 20px auto 0;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            grid-template-rows: repeat(2, 58px);

            gap: 10px;

            touch-action: manipulation;

            user-select: none;
        }

        .control {
            width: 100%;

            height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 0;

            margin: 0;

            font-size: 24px;

            font-weight: bold;

            color: #00ffff;

            background:
                linear-gradient(
                    145deg,
                    rgba(0, 255, 255, 0.12),
                    rgba(124, 60, 255, 0.10)
                );

            border: 1px solid rgba(0, 255, 255, 0.25);

            border-radius: 16px;

            box-shadow:
                inset 0 0 15px rgba(0, 255, 255, 0.04),
                0 0 12px rgba(0, 255, 255, 0.06);

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;

            transition:
                transform 0.08s,
                background 0.15s,
                box-shadow 0.15s;
        }


        /* UP */

        .control:nth-child(1) {
            grid-column: 2;
            grid-row: 1;
        }


        /* LEFT */

        .control:nth-child(2) {
            grid-column: 1;
            grid-row: 2;
        }


        /* DOWN */

        .control:nth-child(3) {
            grid-column: 2;
            grid-row: 2;
        }


        /* RIGHT */

        .control:nth-child(4) {
            grid-column: 3;
            grid-row: 2;
        }


        /* กดปุ่ม */

        .control:active {
            transform: scale(0.90);

            color: white;

            background:
                linear-gradient(
                    145deg,
                    rgba(0, 255, 255, 0.30),
                    rgba(124, 60, 255, 0.25)
                );

            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.30),
                inset 0 0 15px rgba(0, 255, 255, 0.15);
        }


        /* =========================
           HINT
        ========================= */

        .hint {
            text-align: center;

            margin-top: 15px;

            color: #66748d;

            font-size: 12px;
        }


        /* =========================
           GAME OVER
        ========================= */

        .game-over {
            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;

            align-items: center;

            background: rgba(0, 0, 0, 0.72);

            backdrop-filter: blur(8px);
        }

        .game-over-card {
            width: min(90%, 400px);

            padding: 40px;

            text-align: center;

            border-radius: 25px;

            background: rgba(10, 18, 35, 0.95);

            border: 1px solid rgba(255, 0, 100, 0.25);

            box-shadow:
                0 0 50px rgba(255, 0, 100, 0.15);
        }

        .game-over-card h2 {
            font-size: 40px;

            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #ff3c7d,
                #ff7b00
            );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .game-over-card p {
            color: #9ba8bd;

            margin-bottom: 25px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                align-items: flex-start;

                overflow-y: auto;

                padding: 10px 0;
            }

            .game-container {
                width: 100%;

                padding: 12px;

                border-radius: 20px;

                background: rgba(10, 18, 35, 0.88);
            }

            .title {
                margin-bottom: 12px;
            }

            .title h1 {
                font-size: 30px;

                letter-spacing: 3px;
            }

            .title p {
                font-size: 12px;
            }

            .top-bar {
                gap: 8px;

                margin-bottom: 10px;
            }

            .score-box {
                padding: 9px;

                border-radius: 12px;
            }

            .score-box span {
                font-size: 10px;
            }

            .score-box strong {
                font-size: 19px;
            }

            #gameCanvas {
                border-radius: 18px;
            }


            /* ปุ่ม Pause / Restart */

            .buttons {
                gap: 8px;

                margin-top: 12px;
            }

            .buttons button {
                min-height: 48px;

                padding: 10px 8px;

                font-size: 13px;

                border-radius: 13px;
            }


            /* D-PAD */

            .controls {
                width: min(85vw, 240px);

                grid-template-rows: repeat(2, 62px);

                gap: 10px;

                margin-top: 18px;
            }

            .control {
                height: 62px;

                font-size: 26px;

                border-radius: 17px;

                touch-action: manipulation;
            }

            .hint {
                margin-top: 12px;

                font-size: 10px;

                padding-bottom: 5px;
            }


            /* GAME OVER */

            .game-over-card {
                width: 90%;

                padding: 30px 20px;

                border-radius: 22px;
            }

            .game-over-card h2 {
                font-size: 34px;
            }
        }


        /* =========================
           VERY SMALL PHONE
        ========================= */

        @media (max-width: 360px) {

            .game-container {
                padding: 9px;
            }

            .title h1 {
                font-size: 26px;
            }

            .controls {
                width: 210px;

                grid-template-rows: repeat(2, 56px);

                gap: 8px;
            }

            .control {
                height: 56px;

                font-size: 23px;
            }
        }
    </style>
</head>


<body>

    <div class="game-container">

        <!-- TITLE -->

        <div class="title">

            <h1>NEON SNAKE</h1>

            <p>Eat • Grow • Survive</p>

        </div>


        <!-- SCORE -->

        <div class="top-bar">

            <div class="score-box">

                <span>SCORE</span>

                <strong id="score">0</strong>

            </div>


            <div class="score-box">

                <span>HIGH SCORE</span>

                <strong id="highScore">0</strong>

            </div>

        </div>


        <!-- GAME -->

        <canvas id="gameCanvas"></canvas>


        <!-- PAUSE / RESTART -->

        <div class="buttons">

            <button id="pauseBtn">
                ⏸ Pause
            </button>

            <button
                class="restart"
                onclick="restartGame()"
            >
                🔄 Restart
            </button>

        </div>


        <!-- MOBILE CONTROLS -->

        <div class="controls">

            <button
                class="control"
                onclick="changeDirection('up')"
                aria-label="Up"
            >
                ▲
            </button>


            <button
                class="control"
                onclick="changeDirection('left')"
                aria-label="Left"
            >
                ◀
            </button>


            <button
                class="control"
                onclick="changeDirection('down')"
                aria-label="Down"
            >
                ▼
            </button>


            <button
                class="control"
                onclick="changeDirection('right')"
                aria-label="Right"
            >
                ▶
            </button>

        </div>


        <!-- HINT -->

        <div class="hint">

            Keyboard: ↑ ↓ ← →
            &nbsp; or &nbsp;
            W A S D

        </div>

    </div>


    <!-- GAME OVER -->

    <div
        class="game-over"
        id="gameOver"
    >

        <div class="game-over-card">

            <h2>GAME OVER</h2>

            <p>

                Your score:
                <strong id="finalScore">0</strong>

            </p>


            <button
                class="restart"
                onclick="restartGame()"
            >
                🎮 Play Again
            </button>

        </div>

    </div>


    <script>

        /* =========================
           ELEMENTS
        ========================= */

        const canvas =
            document.getElementById("gameCanvas");

        const ctx =
            canvas.getContext("2d");


        const scoreText =
            document.getElementById("score");

        const highScoreText =
            document.getElementById("highScore");

        const finalScore =
            document.getElementById("finalScore");

        const pauseBtn =
            document.getElementById("pauseBtn");

        const gameOverScreen =
            document.getElementById("gameOver");


        /* =========================
           GAME SETTINGS
        ========================= */

        const GRID = 25;

        let tileSize;

        let snake;

        let food;

        let direction;

        let nextDirection;

        let score = 0;

        let highScore =
            Number(
                localStorage.getItem(
                    "snakeHighScore"
                )
            ) || 0;

        let gameRunning = true;

        let paused = false;

        let speed = 120;

        let particles = [];


        highScoreText.textContent =
            highScore;


        /* =========================
           RESIZE CANVAS
        ========================= */

        function resizeCanvas() {

            const size =
                Math.min(
                    canvas.parentElement.clientWidth,
                    560
                );


            const dpr =
                window.devicePixelRatio || 1;


            canvas.width =
                size * dpr;

            canvas.height =
                size * dpr;


            canvas.style.width =
                size + "px";

            canvas.style.height =
                size + "px";


            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );


            tileSize =
                size / GRID;
        }


        /* =========================
           RANDOM FOOD
        ========================= */

        function randomFood() {

            let position;


            do {

                position = {

                    x:
                        Math.floor(
                            Math.random() *
                            GRID
                        ),

                    y:
                        Math.floor(
                            Math.random() *
                            GRID
                        )

                };

            } while (

                snake.some(
                    part =>
                        part.x ===
                            position.x &&
                        part.y ===
                            position.y
                )

            );


            return position;
        }


        /* =========================
           INIT GAME
        ========================= */

        function initGame() {

            snake = [

                {
                    x: 12,
                    y: 12
                },

                {
                    x: 11,
                    y: 12
                },

                {
                    x: 10,
                    y: 12
                },

                {
                    x: 9,
                    y: 12
                }

            ];


            direction = {

                x: 1,
                y: 0

            };


            nextDirection = {

                x: 1,
                y: 0

            };


            score = 0;

            speed = 120;

            particles = [];


            food =
                randomFood();


            scoreText.textContent =
                score;


            gameRunning = true;

            paused = false;


            pauseBtn.textContent =
                "⏸ Pause";


            gameOverScreen.style.display =
                "none";


            draw();
        }


        /* =========================
           CHANGE DIRECTION
        ========================= */

        function changeDirection(dir) {

            if (!gameRunning)
                return;


            const directions = {

                up: {
                    x: 0,
                    y: -1
                },

                down: {
                    x: 0,
                    y: 1
                },

                left: {
                    x: -1,
                    y: 0
                },

                right: {
                    x: 1,
                    y: 0
                }

            };


            const newDirection =
                directions[dir];


            /* ป้องกันกลับหลังทันที */

            if (

                newDirection.x ===
                    -direction.x &&

                newDirection.y ===
                    -direction.y

            ) {

                return;

            }


            nextDirection =
                newDirection;
        }


        /* =========================
           UPDATE GAME
        ========================= */

        function update() {

            if (
                !gameRunning ||
                paused
            )
                return;


            direction =
                nextDirection;


            const head = {

                x:
                    snake[0].x +
                    direction.x,

                y:
                    snake[0].y +
                    direction.y

            };


            /* ชนกำแพง */

            if (

                head.x < 0 ||

                head.x >= GRID ||

                head.y < 0 ||

                head.y >= GRID

            ) {

                endGame();

                return;

            }


            /* ชนตัวเอง */

            if (

                snake.some(

                    part =>

                        part.x ===
                            head.x &&

                        part.y ===
                            head.y

                )

            ) {

                endGame();

                return;

            }


            snake.unshift(head);


            /* กินอาหาร */

            if (

                head.x === food.x &&

                head.y === food.y

            ) {

                score++;


                scoreText.textContent =
                    score;


                if (
                    score > highScore
                ) {

                    highScore =
                        score;


                    localStorage.setItem(
                        "snakeHighScore",
                        highScore
                    );


                    highScoreText.textContent =
                        highScore;

                }


                createParticles(

                    food.x *
                        tileSize +
                        tileSize / 2,

                    food.y *
                        tileSize +
                        tileSize / 2

                );


                food =
                    randomFood();


                /* ยิ่งกินยิ่งเร็ว */

                speed =
                    Math.max(
                        55,
                        120 -
                            score * 2
                    );

            }

            else {

                snake.pop();

            }

        }


        /* =========================
           BACKGROUND
        ========================= */

        function drawBackground() {

            const width =
                canvas.clientWidth;

            const height =
                canvas.clientHeight;


            ctx.fillStyle =
                "#07101c";


            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            /* Grid */

            ctx.strokeStyle =
                "rgba(0,255,255,0.035)";


            ctx.lineWidth = 1;


            for (
                let i = 0;
                i <= GRID;
                i++
            ) {

                const p =
                    i * tileSize;


                ctx.beginPath();

                ctx.moveTo(
                    p,
                    0
                );

                ctx.lineTo(
                    p,
                    height
                );

                ctx.stroke();


                ctx.beginPath();

                ctx.moveTo(
                    0,
                    p
                );

                ctx.lineTo(
                    width,
                    p
                );

                ctx.stroke();

            }

        }


        /* =========================
           FOOD
        ========================= */

        function drawFood() {

            const x =
                food.x *
                    tileSize +
                tileSize / 2;


            const y =
                food.y *
                    tileSize +
                tileSize / 2;


            const radius =
                tileSize * 0.30;


            /* Glow */

            ctx.shadowColor =
                "#ff2875";

            ctx.shadowBlur =
                22;


            ctx.fillStyle =
                "#ff2875";


            ctx.beginPath();


            ctx.arc(

                x,
                y,
                radius,
                0,
                Math.PI * 2

            );


            ctx.fill();


            ctx.shadowBlur =
                0;


            /* Highlight */

            ctx.fillStyle =
                "white";


            ctx.beginPath();


            ctx.arc(

                x -
                    radius * 0.3,

                y -
                    radius * 0.3,

                radius * 0.22,

                0,
                Math.PI * 2

            );


            ctx.fill();

        }


        /* =========================
           SNAKE
        ========================= */

        function drawSnake() {

            snake.forEach(
                (part, index) => {

                    const padding =
                        1.5;


                    const x =
                        part.x *
                            tileSize +
                        padding;


                    const y =
                        part.y *
                            tileSize +
                        padding;


                    const size =
                        tileSize -
                        padding * 2;


                    const gradient =
                        ctx.createLinearGradient(

                            x,
                            y,

                            x + size,
                            y + size

                        );


                    if (
                        index === 0
                    ) {

                        gradient.addColorStop(
                            0,
                            "#00ffff"
                        );

                        gradient.addColorStop(
                            1,
                            "#00ff88"
                        );

                    }

                    else {

                        gradient.addColorStop(
                            0,
                            "#00d9b7"
                        );

                        gradient.addColorStop(
                            1,
                            "#087f9b"
                        );

                    }


                    ctx.fillStyle =
                        gradient;


                    ctx.shadowColor =
                        index === 0
                            ? "#00ffff"
                            : "#00aaff";


                    ctx.shadowBlur =
                        index === 0
                            ? 18
                            : 8;


                    roundRect(

                        x,
                        y,
                        size,
                        size,

                        tileSize * 0.22

                    );


                    ctx.fill();


                    ctx.shadowBlur =
                        0;


                    /* ตางู */

                    if (
                        index === 0
                    ) {

                        drawSnakeEyes(

                            x,
                            y,
                            size

                        );

                    }

                }
            );

        }


        /* =========================
           SNAKE EYES
        ========================= */

        function drawSnakeEyes(
            x,
            y,
            size
        ) {

            ctx.fillStyle =
                "#031018";


            let eye1;

            let eye2;


            if (
                direction.x !== 0
            ) {

                eye1 = {

                    x:
                        x +
                        size * 0.65,

                    y:
                        y +
                        size * 0.30

                };


                eye2 = {

                    x:
                        x +
                        size * 0.65,

                    y:
                        y +
                        size * 0.70

                };

            }

            else {

                eye1 = {

                    x:
                        x +
                        size * 0.30,

                    y:
                        y +
                        size * 0.30

                };


                eye2 = {

                    x:
                        x +
                        size * 0.70,

                    y:
                        y +
                        size * 0.30

                };

            }


            ctx.beginPath();


            ctx.arc(

                eye1.x,
                eye1.y,

                size * 0.08,

                0,
                Math.PI * 2

            );


            ctx.fill();


            ctx.beginPath();


            ctx.arc(

                eye2.x,
                eye2.y,

                size * 0.08,

                0,
                Math.PI * 2

            );


            ctx.fill();

        }


        /* =========================
           ROUND RECT
        ========================= */

        function roundRect(
            x,
            y,
            width,
            height,
            radius
        ) {

            ctx.beginPath();


            ctx.roundRect(

                x,
                y,
                width,
                height,
                radius

            );

        }


        /* =========================
           PARTICLES
        ========================= */

        function createParticles(
            x,
            y
        ) {

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                particles.push({

                    x,
                    y,

                    vx:
                        (Math.random() - 0.5) *
                        4,

                    vy:
                        (Math.random() - 0.5) *
                        4,

                    life: 1

                });

            }

        }


        function drawParticles() {

            particles.forEach(
                p => {

                    p.x += p.vx;

                    p.y += p.vy;

                    p.life -= 0.04;


                    ctx.globalAlpha =
                        Math.max(
                            0,
                            p.life
                        );


                    ctx.fillStyle =
                        "#00ffff";


                    ctx.beginPath();


                    ctx.arc(

                        p.x,
                        p.y,

                        3,

                        0,
                        Math.PI * 2

                    );


                    ctx.fill();

                }
            );


            ctx.globalAlpha = 1;


            particles =
                particles.filter(
                    p =>
                        p.life > 0
                );

        }


        /* =========================
           DRAW
        ========================= */

        function draw() {

            drawBackground();

            drawFood();

            drawSnake();

            drawParticles();

        }


        /* =========================
           GAME OVER
        ========================= */

        function endGame() {

            gameRunning = false;


            finalScore.textContent =
                score;


            gameOverScreen.style.display =
                "flex";

        }


        /* =========================
           RESTART
        ========================= */

        function restartGame() {

            initGame();

        }


        /* =========================
           PAUSE
        ========================= */

        pauseBtn.addEventListener(

            "click",

            () => {

                if (!gameRunning)
                    return;


                paused =
                    !paused;


                pauseBtn.textContent =
                    paused
                        ? "▶ Resume"
                        : "⏸ Pause";

            }

        );


        /* =========================
           KEYBOARD
        ========================= */

        document.addEventListener(

            "keydown",

            e => {

                const key =
                    e.key.toLowerCase();


                const keys = {

                    arrowup:
                        "up",

                    w:
                        "up",


                    arrowdown:
                        "down",

                    s:
                        "down",


                    arrowleft:
                        "left",

                    a:
                        "left",


                    arrowright:
                        "right",

                    d:
                        "right"

                };


                if (
                    keys[key]
                ) {

                    e.preventDefault();


                    changeDirection(
                        keys[key]
                    );

                }


                /* Space = Pause */

                if (
                    key === " "
                ) {

                    e.preventDefault();

                    pauseBtn.click();

                }


                /* Enter = Restart */

                if (
                    key === "enter" &&
                    !gameRunning
                ) {

                    restartGame();

                }

            }

        );


        /* =========================
           GAME LOOP
        ========================= */

        let lastTime = 0;

        let accumulator = 0;


        function gameLoop(time) {

            const delta =
                time -
                lastTime;


            lastTime =
                time;


            accumulator +=
                delta;


            if (

                accumulator >= speed &&

                gameRunning &&

                !paused

            ) {

                update();


                accumulator = 0;

            }


            draw();


            requestAnimationFrame(
                gameLoop
            );

        }


        /* =========================
           RESIZE
        ========================= */

        window.addEventListener(

            "resize",

            resizeCanvas

        );


        /* =========================
           START
        ========================= */

        resizeCanvas();

        initGame();


        requestAnimationFrame(
            gameLoop
        );

    </script>

</body>

</html>
